<h1>Trip notes</h1>
<h1>Getting there</h1>
<p>Take the <strong>early</strong> train, not the <em>late</em> one. <u>Really</u>, the <s>bus</s> is slow.</p>
<p>Water is H<sub>2</sub>O and area is m<sup>2</sup>; run <code>make all</code> first.</p>
<p>Book at <a href="https://example.com/trains">the rail site</a> or call <a href="tel:+35722000000">the office</a>.</p>
<p>Leave at ten.</p>
<p>Paphos is by the sea.[1]</p>

<p>[1] Paphos is in Cyprus.</p>
